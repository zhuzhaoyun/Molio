    "desc": "将《资治通鉴》的千年历史整理为结构化、可关联的知识体系，覆盖626个政权与人物、44个事件与制度概念、23 组历史对比。\r\n\r\n适合历史学习、史学研读、写作查证与快速建立《资治通鉴》的整体脉络；导入 Molio 或 obsidan 等本地知识环境后，也可作为 AI 的历史知识源，让 AI 能够围绕人物、事件、政权与制度进行检索、关联与分析。\r\n\r\n不是简单的《资治通鉴》摘要，而是将分散的历史信息组织成一套可以被人阅读，也可以被 AI 长期调用的知识资产。",
    "price": 990,
    "ver": "v1.0"
  }
];
const definitions=[['history-literature','历史与文学'],['philosophy','哲学'],['medicine','医学'],['law','法律'],['education','教育'],['engineering','工程技术']];
const initial=BASE.map(r=>({...r,cat:['history','literature'].includes(r.cat)?'history-literature':r.cat}));
let resources=initial.slice(), categories=definitions.map(([id,name])=>({id,name}));
const state={cat:'all',type:'all',q:'',sort:'default',page:1};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=id=>categories.find(c=>c.id===id)?.name||'未分类';
const price=r=>r.price===0?'免费':'¥'+(r.price/100).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
function filtered(cat=state.cat){const words=state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);return resources.filter(r=>(cat==='all'||r.cat===cat)&&(state.type==='all'||r.type===state.type)&&words.every(w=>[r.name,r.desc,...r.tags,label(r.cat),r.type].join(' ').toLowerCase().includes(w)));}
function sorted(rows){return rows.slice().sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name,'zh-CN'):state.sort==='price'?a.price-b.price:0);}
function card(r){return `<article class="card"><div class="cardmeta"><span class="stamp"><span class="symbol" style="background:${esc(r.tint)}">${esc(r.icon)}</span>${esc(label(r.cat))} / ${esc(r.type)}</span><span>${r.demo?'演示新增 · ':''}${esc(r.ver)}</span></div><h3>${esc(r.name)}</h3><p>${esc(r.desc)}</p><div class="tags">${r.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="cardfoot"><span class="price ${r.price===0?'free':''}">${price(r)}</span><button data-detail="${esc(r.id)}">查看详情 ↗</button></div></article>`;}
function categoryButtons(){const q=$('#category-search').value.trim().toLowerCase();$('#category-list').innerHTML=[{id:'all',name:'全部资源'},...categories].filter(c=>c.name.toLowerCase().includes(q)).map(c=>`<button data-cat="${c.id}" aria-pressed="${state.cat===c.id}"><span>${esc(c.name)}</span><small>${filtered(c.id).length}</small></button>`).join('')||'<p>没有匹配的分类</p>';}
function render(){const types=[...new Set(resources.map(r=>r.type))];$('#type-row').hidden=types.length<2;$('#type').innerHTML='<option value="all">全部类型</option>'+types.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');$('#type').value=state.type;
const quick=categories;
$('#quick').innerHTML=[{id:'all',name:'全部资源'},...quick].map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${state.cat===c.id}">${esc(c.name)}<small>${filtered(c.id).length}</small></button>`).join('');
const rows=sorted(filtered()),active=state.cat!=='all'||state.type!=='all'||state.q.trim();$('#status').innerHTML=`<strong>${esc(state.cat==='all'?'全部资源':label(state.cat))}</strong>${state.type!=='all'?' · '+esc(state.type):''}${state.q.trim()?' · “'+esc(state.q.trim())+'”':''} · ${rows.length} 个资源${active?'<button class="clear" id="clear-all">清除条件</button>':''}`;$('#clear-search').hidden=!state.q;
let html='';$('#pagination').innerHTML='';if(!rows.length){html=`<div class="empty"><h2>暂时没有找到匹配的资源</h2><p>试试更短的关键词，或扩大搜索范围。</p>${state.cat!=='all'||state.type!=='all'?'<button class="primary" id="search-all">搜索全部资源</button>':''}<button id="empty-clear">清除条件</button></div>`;}else if(!active){html=categories.map(c=>{const list=rows.filter(r=>r.cat===c.id);return list.length?`<section class="section"><div class="sectionhead"><h2>${esc(c.name)}<small>${list.length} 个资源</small></h2><button data-cat="${c.id}">查看全部 ${list.length} 个 →</button></div><div class="grid">${list.slice(0,6).map(card).join('')}</div></section>`:'';}).join('');}else{const pages=Math.ceil(rows.length/9);state.page=Math.min(state.page,pages);html=`<section class="section"><div class="grid">${rows.slice((state.page-1)*9,state.page*9).map(card).join('')}</div></section>`;if(pages>1)$('#pagination').innerHTML=`<button data-page="${state.page-1}" ${state.page===1?'disabled':''}>上一页</button><span>${state.page} / ${pages}</span><button data-page="${state.page+1}" ${state.page===pages?'disabled':''}>下一页</button>`;}
$('#content').innerHTML=html;categoryButtons();$('#category-options').innerHTML=categories.map(c=>`<option value="${esc(c.name)}">`).join('');$('#type-options').innerHTML=types.map(t=>`<option value="${esc(t)}">`).join('');}
function clear(){Object.assign(state,{cat:'all',type:'all',q:'',page:1});$('#search').value='';render();}
function announce(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(announce.timer);announce.timer=setTimeout(()=>$('#toast').hidden=true,3500);}
document.addEventListener('click',e=>{const cat=e.target.closest('[data-cat]');if(cat){state.cat=cat.dataset.cat;state.page=1;render();if($('#categories').open)$('#categories').close();return;}if(e.target.closest('[data-close]')){e.target.closest('dialog').close();return;}const detail=e.target.closest('[data-detail]');if(detail){const r=resources.find(r=>r.id===detail.dataset.detail);$('#detail-body').innerHTML=`<h3>${esc(r.name)}</h3><div class="detailmeta">${esc(label(r.cat))} · ${esc(r.type)} · ${esc(r.ver)}</div><p>${esc(r.desc)}</p><p class="price">${price(r)}</p>`;$('#details').showModal();return;}const pg=e.target.closest('[data-page]');if(pg){state.page=Number(pg.dataset.page);render();$('.filters').scrollIntoView({block:'start'});return;}const query=e.target.closest('[data-query]');if(query){state.q=query.dataset.query;state.page=1;$('#search').value=state.q;render();}if(e.target.closest('#clear-all,#empty-clear'))clear();if(e.target.closest('#search-all')){state.cat=state.type='all';state.page=1;render();}});
$('#search').addEventListener('input',e=>{state.q=e.target.value;state.page=1;render();});$('#clear-search').onclick=()=>{state.q='';$('#search').value='';state.page=1;render();$('#search').focus();};$('#sort').onchange=e=>{state.sort=e.target.value;state.page=1;render();};$('#type').onchange=e=>{state.type=e.target.value;state.page=1;render();};$('#all-open').onclick=()=>{$('#category-search').value='';categoryButtons();$('#categories').showModal();};$('#category-search').oninput=categoryButtons;$('#add-open').onclick=()=>$('#add').showModal();$('#reset').onclick=()=>{resources=initial.slice();categories=definitions.map(([id,name])=>({id,name}));state.sort='default';$('#sort').value='default';clear();announce('已恢复线上快照的 '+initial.length+' 条资源');};
$('#add-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),catName=f.get('category').trim(),type=f.get('type').trim(),desc=f.get('desc').trim();if(!name||!catName||!type||!desc){announce('请填写名称、分类、类型和简介');return;}let cat=categories.find(c=>c.name===catName);if(!cat){cat={id:'cat'+Date.now(),name:catName};categories.push(cat);}resources.push({id:'new'+Date.now(),name,cat:cat.id,type,desc,tags:f.get('tags').split(/[,，]/).map(t=>t.trim()).filter(Boolean),price:Math.round(Number(f.get('price'))*100),ver:'v1.0',icon:'▤',tint:'#e8edf2',demo:true});Object.assign(state,{cat:cat.id,type:'all',q:'',page:1});$('#search').value='';$('#add').close();render();announce('已加入目录：'+catName+' / '+type);};
render();
</script>
</html>
