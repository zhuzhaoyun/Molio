name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-dirty*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.2.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Smoke test: build unpacked app → launch → verify daemon + UI ──
  smoke-test:
    name: Smoke test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch-flag: ""
            label: "Windows x64"
          - os: macos-latest
            platform: mac
            arch-flag: "--arm64"
            label: "macOS arm64"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build unpacked app
        working-directory: apps/desktop
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.arch-flag }} --dir

      # ── Windows smoke test ──
      - name: Launch app and verify (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "apps/desktop/dist/win-unpacked" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in win-unpacked" }
          Write-Host "Launching: $($exe.FullName)"

          $proc = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput "$env:TEMP\daemon-stdout.log" -RedirectStandardError "$env:TEMP\daemon-stderr.log"
          Write-Host "PID: $($proc.Id)"

          try {
            # Wait for daemon (port 3100)
            Write-Host "Waiting for daemon (http://localhost:3100/api/health)..."
            $healthy = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://localhost:3100/api/health" -TimeoutSec 2 -UseBasicParsing -ErrorAction Stop
                if ($r.StatusCode -eq 200) {
                  Write-Host "✅ Daemon healthy (attempt $($i+1)s)"
                  $healthy = $true
                  break
                }
              } catch {}
            }
            if (-not $healthy) {
              Write-Host "❌ Daemon did not respond within 45s"
              if (Test-Path "$env:TEMP\daemon-stdout.log") { Write-Host "--- stdout ---"; Get-Content "$env:TEMP\daemon-stdout.log" -Tail 30 }
              if (Test-Path "$env:TEMP\daemon-stderr.log") { Write-Host "--- stderr ---"; Get-Content "$env:TEMP\daemon-stderr.log" -Tail 30 }
              throw "Smoke test failed: daemon unreachable"
            }

            # Verify web UI served from daemon
            Write-Host "Checking web UI (http://localhost:3100/)..."
            $web = Invoke-WebRequest -Uri "http://localhost:3100/" -TimeoutSec 10 -UseBasicParsing
            if ($web.Content -notmatch 'root|app|molio') {
              Write-Host "Response (first 500 chars): $($web.Content.Substring(0, [Math]::Min(500, $web.Content.Length)))"
              throw "Web UI did not load — HTML missing expected content"
            }
            Write-Host "✅ Web UI loaded"

            # Verify static assets (JS/CSS bundles)
            $assetCheck = Invoke-WebRequest -Uri "http://localhost:3100/" -TimeoutSec 10 -UseBasicParsing
            $hasJs = $assetCheck.Content -match '\.js'
            $hasCss = $assetCheck.Content -match '\.css'
            Write-Host "✅ Static assets referenced (JS: $hasJs, CSS: $hasCss)"

          } finally {
            Write-Host "Stopping app..."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

      - name: Upload daemon logs on failure
        if: failure() && matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/daemon-stdout.log
            ${{ runner.temp }}/daemon-stderr.log
          retention-days: 7

      # ── macOS smoke test ──
      - name: Launch app and verify (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          APP_PATH="apps/desktop/dist/mac-arm64/Molio.app/Contents/MacOS/Molio"
          if [ ! -f "$APP_PATH" ]; then
            echo "❌ App binary not found at $APP_PATH"
            find apps/desktop/dist/ -name "Molio" -type f 2>/dev/null || true
            exit 1
          fi

          echo "Launching: $APP_PATH"
          "$APP_PATH" > /tmp/daemon-stdout.log 2>&1 &
          APP_PID=$!
          echo "PID: $APP_PID"

          cleanup() {
            echo "Stopping app..."
            kill "$APP_PID" 2>/dev/null || true
            sleep 2
            kill -9 "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for daemon
          echo "Waiting for daemon (http://localhost:3100/api/health)..."
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3100/api/health > /dev/null 2>&1; then
              echo "✅ Daemon healthy (attempt ${i}s)"
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "❌ Daemon did not respond within 45s"
              echo "--- stdout/stderr (last 30 lines) ---"
              tail -30 /tmp/daemon-stdout.log 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Verify web UI
          echo "Checking web UI (http://localhost:3100/)..."
          if curl -sf http://localhost:3100/ | grep -qiE 'root|app|molio'; then
            echo "✅ Web UI loaded"
          else
            echo "❌ Web UI did not load"
            curl -sf http://localhost:3100/ | head -20 || true
            exit 1
          fi

      - name: Upload daemon logs on failure (macOS)
        if: failure() && matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.platform }}
          path: /tmp/daemon-stdout.log
          retention-days: 7

  # ── Build & publish (only if smoke test passes) ──────────────────
  build:
    needs: smoke-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch-flag: ""
            label: "Windows x64"
          - os: macos-latest
            platform: mac
            arch-flag: "--arm64"
            label: "macOS arm64"

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version=$(echo "${{ inputs.version }}" | xargs)
          else
            raw=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
            version=${raw#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Desktop installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.arch-flag }} --publish always "--config.extraMetadata.version=${{ steps.version.outputs.version }}"

      - name: Verify update manifest exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          # Poll for release assets with exponential backoff
          # (GitHub may take a moment to finish uploading after electron-builder exits)
          echo "Checking release assets for ${TAG}..."
          ASSETS=""
          for i in 1 2 3 4 5; do
            ASSETS=$(gh release view "${TAG}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || echo "")
            if [ -n "$ASSETS" ]; then break; fi
            DELAY=$(( i * 5 ))
            echo "  attempt ${i}: no assets yet, retrying in ${DELAY}s..."
            sleep "${DELAY}"
          done

          if [ -z "$ASSETS" ]; then
            echo "::error::No assets found in release ${TAG}"
            exit 1
          fi

          echo "Release assets:"
          echo "$ASSETS"

          # Verify platform-specific update manifest exists
          if [ "${{ matrix.platform }}" = "win" ]; then
            MANIFEST="latest.yml"
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            MANIFEST="latest-mac.yml"
          else
            MANIFEST="latest-linux.yml"
          fi

          if echo "$ASSETS" | grep -q "^${MANIFEST}$"; then
            echo "✓ Update manifest '${MANIFEST}' found — auto-update will detect v${VERSION}"
          else
            echo "::error::Update manifest '${MANIFEST}' NOT found in release ${TAG}. Auto-update will NOT detect this version!"
            exit 1
          fi

          # Validate manifest content: version must match
          if [ "${{ matrix.platform }}" = "win" ]; then
            MANIFEST_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/latest.yml"
            echo "Fetching manifest from ${MANIFEST_URL}..."
            MANIFEST_CONTENT=$(curl -sL "$MANIFEST_URL" || echo "")
            if echo "$MANIFEST_CONTENT" | grep -q "version: ${VERSION}"; then
              echo "✓ Manifest version matches ${VERSION}"
            else
              echo "::error::Manifest version does not match ${VERSION}. Content:"
              echo "$MANIFEST_CONTENT"
              exit 1
            fi
          fi

      # ── Add macOS Gatekeeper notice to release body ──
      - name: Add macOS Gatekeeper notice to release body
        if: matrix.platform == 'mac' && ! cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          NOTICE="## ⚠️ macOS 用户必读

          如果打开 Molio 时提示"已损坏，无法打开"，这是 macOS 安全机制（Gatekeeper）的正常提示，
          因为 Molio 目前未经过 Apple 公证（需要 Apple Developer Program）。
          **应用本身没有问题**，请按以下方法解决：

          ### 方法一（推荐）
          在 Finder 中 **右键** 点击 Molio.app → 选择 **"打开"** → 点击 **"打开"** 按钮。
          （只需操作一次，以后可直接双击打开）

          ### 方法二
          打开终端，运行以下命令：
          \`\`\`bash
          sudo xattr -d com.apple.quarantine /Applications/Molio.app
          \`\`\`

          ---
          "

          # Get current body, prepend notice, update
          BODY=$(gh release view "${TAG}" --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null || echo "")
          if echo "$BODY" | grep -q "macOS 用户必读\|Gatekeeper"; then
            echo "✓ Release body already has macOS notice — skipping"
          else
            echo "Prepending macOS notice to release body..."
            gh release edit "${TAG}" --repo "${{ github.repository }}" --notes "${NOTICE}${BODY}"
            echo "✓ macOS notice added to release body"
          fi

  # ── Upload release assets to Alibaba Cloud OSS (China mirror) ──
  upload-oss:
    name: Upload to Alibaba Cloud OSS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version=$(echo "${{ inputs.version }}" | xargs)
          else
            raw=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
            version=${raw#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "Downloading assets from ${TAG}..."
          gh release download "${TAG}" --dir ./release-assets --skip-existing
          echo "Downloaded files:"
          ls -la ./release-assets/

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Obtain STS credentials via OIDC
        env:
          ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
          ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
        run: |
          # Get OIDC token from GitHub
          echo "::group::OIDC Token Request"
          export ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.aliyuncs.com" | jq -r '.value')
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "❌ Failed to get OIDC token from GitHub"
            exit 1
          fi
          echo "✅ OIDC token obtained (${#ID_TOKEN} chars)"
          echo "::endgroup::"

          # Call STS AssumeRoleWithOIDC via Python SDK with OIDC credential type
          echo "::group::STS AssumeRoleWithOIDC"
          pip install -q alibabacloud_sts20150401 alibabacloud_credentials
          python3 scripts/sts_oidc.py \
            --role-arn "${ALIYUN_ROLE_ARN}" \
            --oidc-provider-arn "${ALIYUN_OIDC_PROVIDER_ARN}" \
            --session-name "github-actions-${{ github.run_id }}" \
            > /tmp/sts_output.json
          CREDENTIALS=$(cat /tmp/sts_output.json)
          echo "STS response: $CREDENTIALS"
          echo "::endgroup::"

          # Extract credentials
          AK_ID=$(echo "$CREDENTIALS" | jq -r '.AccessKeyId')
          AK_SECRET=$(echo "$CREDENTIALS" | jq -r '.AccessKeySecret')
          STS_TOKEN=$(echo "$CREDENTIALS" | jq -r '.SecurityToken')

          if [ -z "$AK_ID" ] || [ "$AK_ID" = "null" ]; then
            echo "❌ Failed to extract credentials from STS response"
            echo "Raw response: $CREDENTIALS"
            exit 1
          fi
          echo "✅ STS credentials obtained"

          # Persist for subsequent steps
          echo "OSS_ACCESS_KEY_ID=$AK_ID" >> $GITHUB_ENV
          echo "OSS_ACCESS_KEY_SECRET=$AK_SECRET" >> $GITHUB_ENV
          echo "OSS_SECURITY_TOKEN=$STS_TOKEN" >> $GITHUB_ENV

      - name: Upload release assets to OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ env.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ env.OSS_ACCESS_KEY_SECRET }}
          OSS_SECURITY_TOKEN: ${{ env.OSS_SECURITY_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          # Upload all release assets
          for file in ./release-assets/*; do
            filename=$(basename "$file")
            ossutil cp "$file" oss://${{ vars.OSS_BUCKET }}/releases/${TAG}/${filename} \
              --endpoint=${{ vars.OSS_ENDPOINT }} \
              -i "${OSS_ACCESS_KEY_ID}" \
              -k "${OSS_ACCESS_KEY_SECRET}" \
              -t "${OSS_SECURITY_TOKEN}" \
              --update
          done

          # Only update latest.json and latest.yml for stable releases (skip test/beta/alpha/rc)
          if echo "${VERSION}" | grep -qiE '(test|beta|alpha|rc|dirty)'; then
            echo "⏭️  Skipping latest.json/latest.yml update — ${VERSION} is a pre-release"
          else
            cat > /tmp/latest.json <<EOF
          {"version":"${VERSION}","updatedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
            ossutil cp /tmp/latest.json oss://${{ vars.OSS_BUCKET }}/releases/latest.json \
              --endpoint=${{ vars.OSS_ENDPOINT }} \
              -i "${OSS_ACCESS_KEY_ID}" \
              -k "${OSS_ACCESS_KEY_SECRET}" \
              -t "${OSS_SECURITY_TOKEN}" \
              --meta Cache-Control:no-cache \
              --force
            echo "✅ Updated latest.json to ${VERSION}"

            # Copy latest.yml from version dir to root for electron-updater generic provider.
            # The yml's url/path fields are relative filenames (e.g. "Molio-Setup-0.3.22-windows.exe"),
            # but files live under releases/<tag>/. We must prepend the tag directory so
            # electron-updater resolves the correct download URL.
            LATEST_YML="oss://${{ vars.OSS_BUCKET }}/releases/${TAG}/latest.yml"
            ossutil cp "${LATEST_YML}" /tmp/latest-raw.yml \
              --endpoint=${{ vars.OSS_ENDPOINT }} \
              -i "${OSS_ACCESS_KEY_ID}" \
              -k "${OSS_ACCESS_KEY_SECRET}" \
              -t "${OSS_SECURITY_TOKEN}" \
              --force
            sed -i "s|url: |url: ${TAG}/|g; s|path: |path: ${TAG}/|g" /tmp/latest-raw.yml
            ossutil cp /tmp/latest-raw.yml oss://${{ vars.OSS_BUCKET }}/releases/latest.yml \
              --endpoint=${{ vars.OSS_ENDPOINT }} \
              -i "${OSS_ACCESS_KEY_ID}" \
              -k "${OSS_ACCESS_KEY_SECRET}" \
              -t "${OSS_SECURITY_TOKEN}" \
              --meta Cache-Control:no-cache \
              --force
            echo "✅ Updated latest.yml to ${VERSION} (paths prefixed with ${TAG}/)"
          fi

          echo "✅ Uploaded ${TAG} to oss://${{ vars.OSS_BUCKET }}/releases/${TAG}/"
