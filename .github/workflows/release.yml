name: Molio Harness preinstalled release
on:
  workflow_dispatch:
  push:
    tags: ['harness-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm package
      - name: Verify Windows preinstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem .harness-build/host/apps/desktop/.desktop-build/targets/win-x64 -Recurse -Filter 'Molio Harness.exe' | Select-Object -First 1
          if (!$exe) { throw 'Missing packaged application' }
          apps/cloud/node_modules/.bin/tsx distribution/test/desktop/harness/bundle-smoke.mts $exe.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .harness-build/host/apps/desktop/.desktop-build/targets/*/unsigned-artifacts/*.exe
            .harness-build/host/apps/desktop/.desktop-build/targets/*/unsigned-artifacts/*.dmg
            .harness-build/host/apps/desktop/.desktop-build/targets/*/unsigned-artifacts/*.zip
  publish:
    if: startsWith(github.ref, 'refs/tags/harness-v')
    needs: build
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - name: Publish versioned installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --generate-notes release-assets/*
      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Obtain STS credentials via OIDC
        env:
          ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
          ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
        run: |
          # Get OIDC token from GitHub
          echo "::group::OIDC Token Request"
          export ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.aliyuncs.com" | jq -r '.value')
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "❌ Failed to get OIDC token from GitHub"
            exit 1
          fi
          echo "✅ OIDC token obtained (${#ID_TOKEN} chars)"
          echo "::endgroup::"

          # Call STS AssumeRoleWithOIDC via Python SDK with OIDC credential type
          echo "::group::STS AssumeRoleWithOIDC"
          pip install -q alibabacloud_sts20150401 alibabacloud_credentials
          python3 scripts/sts_oidc.py \
            --role-arn "${ALIYUN_ROLE_ARN}" \
            --oidc-provider-arn "${ALIYUN_OIDC_PROVIDER_ARN}" \
            --session-name "github-actions-${{ github.run_id }}" \
            > /tmp/sts_output.json
          CREDENTIALS=$(cat /tmp/sts_output.json)

          echo "::endgroup::"

          # Extract credentials
          AK_ID=$(echo "$CREDENTIALS" | jq -r '.AccessKeyId')
          AK_SECRET=$(echo "$CREDENTIALS" | jq -r '.AccessKeySecret')
          STS_TOKEN=$(echo "$CREDENTIALS" | jq -r '.SecurityToken')

          if [ -z "$AK_ID" ] || [ "$AK_ID" = "null" ]; then
            echo "❌ Failed to extract credentials from STS response"

            exit 1
          fi
          echo "✅ STS credentials obtained"

          # Persist for subsequent steps
          echo "OSS_ACCESS_KEY_ID=$AK_ID" >> $GITHUB_ENV
          echo "OSS_ACCESS_KEY_SECRET=$AK_SECRET" >> $GITHUB_ENV
          echo "OSS_SECURITY_TOKEN=$STS_TOKEN" >> $GITHUB_ENV

      - name: Upload release assets to OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ env.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ env.OSS_ACCESS_KEY_SECRET }}
          OSS_SECURITY_TOKEN: ${{ env.OSS_SECURITY_TOKEN }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          export TAG="$GITHUB_REF_NAME"
          bash scripts/upload-release-assets.sh ./release-assets
