name: E2E Full

on:
  schedule:
    # 03:00 UTC = 11:00 Asia/Shanghai
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (defaults to main)'
        required: false
        default: 'main'

jobs:
  e2e-full:
    # 钉 ubuntu-24.04（原因见 pr-check.yml 的 e2e-affected 注释）：
    # ubuntu-latest 已是 ubuntu26.04，Playwright 1.60 装不上 chromium。
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # CI runners are outside China — use the official npm registry instead of
          # npmmirror.com to avoid CDN routing issues (e.g. app-builder-bin timeouts).
          npm_config_registry: https://registry.npmjs.org

      - name: Build all packages
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run full E2E suite (P0+P1+P2)
        run: npx playwright test
        working-directory: apps/web
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full-${{ github.run_id }}
          path: apps/web/test-results/
          retention-days: 7

  desktop-e2e:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm package:dir
      - name: Verify packaged knowledge, graph and marketplace
        shell: pwsh
        run: |
          $exe = Get-ChildItem .harness-build/host/apps/desktop/.desktop-build/targets/win-x64 -Recurse -Filter 'Molio Harness.exe' | Select-Object -First 1
          if (!$exe) { throw 'Missing packaged application' }
          apps/cloud/node_modules/.bin/tsx distribution/test/desktop/harness/bundle-smoke.mts $exe.FullName
