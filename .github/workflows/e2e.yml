name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (defaults to current branch)'
        required: false
        default: ''
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start daemon in background
        run: |
          pnpm --filter @molio/daemon dev &
          echo $! > /tmp/daemon.pid

      - name: Start web dev server in background
        run: |
          pnpm --filter @molio/web dev &
          echo $! > /tmp/web.pid

      - name: Wait for services to be ready
        run: |
          echo "Waiting for daemon (:3100)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/health > /dev/null 2>&1; then
              echo "Daemon is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Daemon failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for web dev server (:5173)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Web dev server is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Web dev server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Run E2E tests
        run: npx playwright test
        working-directory: apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 7
