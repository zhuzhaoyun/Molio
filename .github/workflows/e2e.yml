name: E2E Full

on:
  schedule:
    # 03:00 UTC = 11:00 Asia/Shanghai
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test (defaults to main)'
        required: false
        default: 'main'

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # CI runners are outside China — use the official npm registry instead of
          # npmmirror.com to avoid CDN routing issues (e.g. app-builder-bin timeouts).
          npm_config_registry: https://registry.npmjs.org

      - name: Build all packages
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run full E2E suite (P0+P1+P2)
        run: npx playwright test
        working-directory: apps/web
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full-${{ github.run_id }}
          path: apps/web/test-results/
          retention-days: 7
