name: E2E Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/daemon/**'
      - 'packages/contracts/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start daemon
        run: pnpm --filter @molio/daemon dev &
        env:
          NODE_ENV: test

      - name: Start web dev server
        run: pnpm --filter @molio/web dev &

      - name: Wait for services
        run: |
          # Wait for daemon (:3100)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/health > /dev/null 2>&1; then
              echo "✅ Daemon ready"
              break
            fi
            echo "Waiting for daemon... ($i/30)"
            sleep 2
          done

          # Wait for web (:5173)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "✅ Web ready"
              break
            fi
            echo "Waiting for web... ($i/30)"
            sleep 2
          done

          # Final check
          curl -sf http://localhost:3100/api/health || { echo "❌ Daemon not ready"; exit 1; }
          curl -sf http://localhost:5173 || { echo "❌ Web not ready"; exit 1; }

      - name: Run E2E tests
        run: npx playwright test
        working-directory: apps/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
