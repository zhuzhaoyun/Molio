name: Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: impact-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    # Only run on PRs from the same repo — fork PRs can't access gh token for comments
    # and we don't want to run analysis on unvetted external code.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get PR diff
        run: |
          # Use local git diff instead of `gh pr diff` — GitHub's API caps diff
          # responses at 20000 lines and returns HTTP 406 for larger PRs, which
          # silently breaks impact analysis on big PRs (e.g. #127). With
          # fetch-depth: 0 above, both SHAs are already local.
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > pr.diff
          gh pr view ${{ github.event.pull_request.number }} --json title,body > pr-meta.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run impact analysis
        run: node scripts/codegraph-impact.mjs --diff pr.diff --out impact.json

      - name: Match affected areas
        id: areas
        run: |
          # Read impact.json and area-map.json, find matched areas, output as markdown
          node <<'EOF' > areas.md
          import { readFileSync } from 'node:fs';
          const impact = JSON.parse(readFileSync('impact.json', 'utf8'));
          const areaMap = JSON.parse(readFileSync('apps/web/e2e/area-map.json', 'utf8'));

          function globMatch(pattern, path) {
            let re = pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&');
            re = re.replace(/\{([^}]+)\}/g, (_, g) => `(${g.split(',').join('|')})`);
            re = re.replace(/\*\*/g, ' ');
            re = re.replace(/\*/g, '[^/]*');
            re = re.replace(/ /g, '.*');
            return new RegExp(`^${re}$`).test(path);
          }

          const matchedAreas = [];
          for (const [areaName, area] of Object.entries(areaMap.areas)) {
            for (const file of impact.changed_files) {
              if (matchedAreas.includes(areaName)) continue;
              for (const pattern of area.paths || []) {
                if (globMatch(pattern, file)) {
                  matchedAreas.push(areaName);
                  break;
                }
              }
            }
          }

          // Find specs for matched areas
          const affectedSpecs = new Set();
          for (const areaName of matchedAreas) {
            const area = areaMap.areas[areaName];
            for (const specName of area.specs || []) {
              const spec = areaMap.specs[specName];
              if (spec && (spec.priority === 'P0' || spec.priority === 'P1')) {
                affectedSpecs.add(`${spec.file} (${spec.priority})`);
              }
            }
          }

          // Build markdown
          let md = '## Affected Areas & Test Selection\n\n';
          if (matchedAreas.length > 0) {
            md += '**Matched areas:**\n';
            for (const a of matchedAreas) md += `- \`${a}\`\n`;
          } else {
            md += '**No area matched.** Only P0 specs will run as baseline.\n';
          }
          md += '\n';

          md += `**Changed files:** ${impact.changed_files.length}\n`;
          for (const f of impact.changed_files.slice(0, 20)) md += `- \`${f}\`\n`;
          if (impact.changed_files.length > 20) md += `- ... and ${impact.changed_files.length - 20} more\n`;
          md += '\n';

          md += '**Top changed symbols (by caller count):**\n';
          md += '| Symbol | Kind | Callers |\n|---|---|---|\n';
          for (const s of impact.changed_symbols.slice(0, 15)) {
            md += `| \`${s.name}\` | ${s.kind} | ${s.callers} |\n`;
          }
          md += '\n';

          md += '**E2E specs that will run on this PR:**\n';
          if (affectedSpecs.size > 0) {
            for (const s of [...affectedSpecs].sort()) md += `- ${s}\n`;
          } else {
            md += '- (P0 baseline only — see `apps/web/e2e/area-map.json`)\n';
          }

          md += '\n---\n_Generated by Impact Analysis workflow. This is informational, not a gate._\n';
          process.stdout.write(md);
          EOF

          cat areas.md

      - name: Comment on PR
        run: |
          # Delete old impact analysis comments
          OLD_COMMENT_IDS=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.body | startswith("## Affected Areas & Test Selection")) | .id' 2>/dev/null || echo "")
          for id in $OLD_COMMENT_IDS; do
            gh api -X DELETE repos/${{ github.repository }}/issues/comments/$id 2>/dev/null || true
          done

          gh pr comment ${{ github.event.pull_request.number }} --body-file areas.md
        env:
          GH_TOKEN: ${{ github.token }}
