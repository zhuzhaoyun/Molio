name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run daemon tests
        run: pnpm --filter @molio/daemon test

      - name: Run desktop tests (updater regression)
        run: pnpm --filter @molio/desktop test

      - name: Verify desktop resources build
        run: |
          cd apps/desktop
          node scripts/prepare-resources.mjs

          # daemon.mjs must exist (ESM parsing by Electron embedded Node.js)
          test -f resources/daemon/daemon.mjs || { echo "❌ daemon.mjs not found"; exit 1; }

          # Electron prebuilt .node binary must exist
          test -f resources/daemon/node_modules/better-sqlite3/build/Release/better_sqlite3.node || { echo "❌ better_sqlite3.node not found"; exit 1; }

          # daemon.js must NOT exist (old format causes CJS parsing error)
          if [ -f resources/daemon/daemon.js ]; then echo "❌ daemon.js must not exist, must be daemon.mjs"; exit 1; fi

          echo "✅ Desktop resources build verified"

      - name: Typecheck
        run: pnpm typecheck

  e2e-affected:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff against base branch

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Select affected E2E specs
        id: specs
        run: |
          SPECS=$(node apps/web/e2e/scripts/select-specs.mjs --base origin/${{ github.base_ref }})
          echo "specs<<EOF" >> $GITHUB_OUTPUT
          echo "$SPECS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run affected E2E
        run: npx playwright test ${{ steps.specs.outputs.specs }}
        working-directory: apps/web
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: apps/web/test-results/
          retention-days: 7
