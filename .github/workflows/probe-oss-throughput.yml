name: Probe OSS upload throughput

# Diagnostic only — never runs on push to main, and never touches a release.
#
# Why this exists: v0.3.59's OSS upload died at the 1h STS token boundary
# because the runner→Guangzhou OSS path had collapsed from ~16.9MB/s (v0.3.56,
# 09-18) to ~156KB/s (v0.3.58, 09-24) with no repo change. Parallelising the
# transfers only fixes that if the throttle is PER CONNECTION; if the whole
# link is capped, four streams move the same aggregate and the release burns
# another hour to fail the same way.
#
# Design note — phases ALTERNATE (1,4,1,4) rather than running "all serial,
# then all parallel". That link varies by ~100x between releases, so a
# back-to-back A-then-B comparison cannot tell a concurrency effect from link
# drift. The first version of this probe did exactly that and reported 0.4x
# from run 36700991995 — an unusable number, because it also drifted. Averaging
# two interleaved repetitions of each configuration is what makes the ratio
# readable. Objects land under releases/_probe-<run-id>/... and are deleted at
# the end; that prefix is inert (electron-updater reads latest*.yml /
# latest.json at the root of releases/, never a directory listing).

on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: 'Size of each probe file, in MiB'
        default: '10'
      file_count:
        description: 'How many probe files per phase'
        default: '4'
  # workflow_dispatch only works once this file is registered on the default
  # branch, so while the probe lives on a side branch it is driven by pushes
  # that touch the probe itself or the upload script it measures.
  push:
    paths:
      - '.github/workflows/probe-oss-throughput.yml'
      - 'scripts/upload-release-assets.sh'

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    name: Measure upload throughput (serial vs 4-wide)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Resolved once here: on a push event there is no `inputs` context at all,
      # so `${{ inputs.size_mb }}` would render empty and silently generate a
      # zero-byte payload (run 36700797222).
      SIZE_MB: ${{ inputs.size_mb || '10' }}
      FILE_COUNT: ${{ inputs.file_count || '4' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Obtain STS credentials via OIDC
        env:
          ALIYUN_ROLE_ARN: ${{ vars.ALIYUN_ROLE_ARN }}
          ALIYUN_OIDC_PROVIDER_ARN: ${{ vars.ALIYUN_OIDC_PROVIDER_ARN }}
        run: |
          export ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.aliyuncs.com" | jq -r '.value')
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "❌ Failed to get OIDC token from GitHub"
            exit 1
          fi
          echo "✅ OIDC token obtained (${#ID_TOKEN} chars)"

          pip install -q alibabacloud_sts20150401 alibabacloud_credentials
          python3 scripts/sts_oidc.py \
            --role-arn "${ALIYUN_ROLE_ARN}" \
            --oidc-provider-arn "${ALIYUN_OIDC_PROVIDER_ARN}" \
            --session-name "probe-oss-${{ github.run_id }}" \
            > /tmp/sts_output.json
          CREDENTIALS=$(cat /tmp/sts_output.json)

          AK_ID=$(echo "$CREDENTIALS" | jq -r '.AccessKeyId')
          AK_SECRET=$(echo "$CREDENTIALS" | jq -r '.AccessKeySecret')
          STS_TOKEN=$(echo "$CREDENTIALS" | jq -r '.SecurityToken')
          if [ -z "$AK_ID" ] || [ "$AK_ID" = "null" ]; then
            echo "❌ Failed to extract credentials from STS response: $CREDENTIALS"
            exit 1
          fi
          echo "✅ STS credentials obtained"

          {
            echo "OSS_ACCESS_KEY_ID=$AK_ID"
            echo "OSS_ACCESS_KEY_SECRET=$AK_SECRET"
            echo "OSS_SECURITY_TOKEN=$STS_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Generate probe payload
        run: |
          mkdir -p probe-assets
          for i in $(seq 1 "${FILE_COUNT}"); do
            head -c $((SIZE_MB * 1024 * 1024)) /dev/urandom > "probe-assets/probe-${i}.bin"
          done
          ls -la probe-assets
          # An empty payload must abort here: the upload script would report a
          # meaningless "aggregate" from zero bytes and we would read it as data.
          generated=$(find probe-assets -type f | wc -l)
          if [ "${generated}" -lt 2 ]; then
            echo "::error::generated ${generated} probe files — need at least 2 to compare serial vs 4-wide"
            exit 1
          fi
          echo "payload=$((SIZE_MB * FILE_COUNT)) MiB in ${generated} files (per phase)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Alternate serial / 4-wide phases
        env:
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          : > /tmp/results.txt
          run_phase() {
            local parallel="$1" label="$2"
            echo "::group::phase ${label} (parallel=${parallel})"
            OSS_UPLOAD_PARALLEL="${parallel}" \
            TAG="_probe-${label}-${{ github.run_id }}" \
              bash scripts/upload-release-assets.sh ./probe-assets | tee "/tmp/${label}.txt"
            local rate
            rate=$(grep -oE 'aggregate [0-9]+ KB/s' "/tmp/${label}.txt" | grep -oE '[0-9]+')
            echo "::endgroup::"
            if [ -z "${rate}" ]; then
              echo "::error::phase ${label} printed no aggregate line"
              exit 1
            fi
            echo "${label} ${parallel} ${rate}" >> /tmp/results.txt
          }

          # Interleaved so that any drift in the link hits both configurations.
          run_phase 1 a1
          run_phase 4 b1
          run_phase 1 a2
          run_phase 4 b2

          cat /tmp/results.txt

      - name: Verdict
        run: |
          # Mean of each configuration's repetitions, one decimal.
          read -r serial wide <<<"$(awk '
            $2 == 1 { s += $3; ns++ }
            $2 == 4 { w += $3; nw++ }
            END {
              s = (ns ? s / ns : 0); w = (nw ? w / nw : 0)
              printf "%d %d", s, w
            }' /tmp/results.txt)"

          echo "serial (1 stream): ${serial} KB/s    wide (4 streams): ${wide} KB/s"
          if [ "${serial}" -gt 0 ]; then
            ratio_x10=$(( wide * 10 / serial ))
            echo "speedup: $(( ratio_x10 / 10 )).$(( ratio_x10 % 10 ))x from 4 streams"
          else
            echo "speedup: n/a (serial phases reported 0 KB/s — check their logs)"
          fi

          {
            echo "### OSS upload probe"
            echo ""
            echo "| configuration | mean aggregate over its phases |"
            echo "|---|---|"
            echo "| serial (1 stream) | ${serial} KB/s |"
            echo "| 4-wide (4 streams) | ${wide} KB/s |"
            echo ""
            echo "Raw phases (label, parallel, KB/s):"
            echo '```'
            cat /tmp/results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Interpretation:"
          echo "  ~4x → per-connection cap; keep the parallel upload"
          echo "  ~1x → the link, not the stream count, is the limit; ship serial"
          echo "        and reach for OSS transfer acceleration when it recurs"

      - name: Clean up probe objects
        if: always()
        run: |
          for label in a1 b1 a2 b2; do
            ossutil rm -r -f "oss://${{ vars.OSS_BUCKET }}/releases/_probe-${label}-${{ github.run_id }}/" \
              --endpoint="${{ vars.OSS_ENDPOINT }}" \
              -i "${OSS_ACCESS_KEY_ID}" \
              -k "${OSS_ACCESS_KEY_SECRET}" \
              -t "${OSS_SECURITY_TOKEN}" \
              || echo "::warning::cleanup of _probe-${label} failed — remove it manually"
          done
