name: Bug Report / Bug 报告
description: 提交一个 Bug 报告 / Report a bug
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！为了帮助我们快速定位和修复问题，请尽量填写以下信息。
        Thank you for reporting a bug! Please fill in the following information to help us quickly locate and fix the issue.

  - type: input
    id: version
    attributes:
      label: 应用版本 / App Version
      description: 你当前使用的 Molio 版本号（可在设置页面查看）/ Your current Molio version (check the Settings page)
      placeholder: "例如 / e.g. 1.2.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统 / Operating System
      description: 你使用的操作系统及版本 / Your OS and version
      placeholder: "例如 / e.g. Windows 11 / macOS 14 / Ubuntu 22.04"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 请清晰描述你遇到的问题、期望行为是什么、实际发生了什么 / Please clearly describe the issue, what you expected and what actually happened
      placeholder: |
        例如：创建新 vault 时，点击"创建"按钮后界面卡住，没有任何反应。期望能成功创建并跳转到知识库页面。
        e.g. When creating a new vault, the UI freezes after clicking the "Create" button. Expected to create successfully and redirect to the knowledge base page.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤 / Reproduction Steps
      description: 请提供能够重现该问题的步骤（可选）/ Please provide steps to reproduce the issue (optional)
      placeholder: |
        1. 打开应用 / Open the app
        2. 点击 '...' / Click '...'
        3. 看到错误 / See error

  - type: textarea
    id: logs
    attributes:
      label: 错误日志 / Error Logs
      description: 请粘贴相关的错误日志或控制台输出（如果有）/ Please paste relevant error logs or console output (if any)
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏 / Screenshots or Recordings
      description: 如果可能，请提供问题的截图或录屏链接 / If possible, provide screenshots or recording links of the issue