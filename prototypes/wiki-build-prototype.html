<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molio — LLM Wiki 构建原型 v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #faf9f7;
  --bg-panel: #ffffff;
  --bg-subtle: #eef1f5;
  --bg-hover: #f0eee9;
  --text: #1a1916;
  --text-strong: #0d0c0a;
  --text-muted: #74716b;
  --text-faint: #b3b0a8;
  --accent: #c96442;
  --accent-hover: #b45a3b;
  --accent-soft: #f5d8cb;
  --green: #2d8a56;
  --green-bg: #e8f5ee;
  --blue: #2563eb;
  --blue-bg: #eff6ff;
  --blue-border: #bfdbfe;
  --amber: #b45309;
  --amber-bg: #fef3c7;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --purple: #7c3aed;
  --purple-bg: #f5f3ff;
  --border: #e5e2dc;
  --border-strong: #d4d0c8;
  --shadow-sm: 0 1px 3px rgba(28,27,26,0.06), 0 1px 2px rgba(28,27,26,0.04);
  --shadow-md: 0 4px 12px rgba(28,27,26,0.08), 0 1px 3px rgba(28,27,26,0.06);
  --shadow-lg: 0 8px 24px rgba(28,27,26,0.12), 0 2px 6px rgba(28,27,26,0.06);
  --radius-sm: 8px;
  --radius: 12px;
  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'SF Mono', 'Menlo', monospace;
  --sidebar-bg: #f4f2ef;
  --sidebar-border: #e8e5e0;
}

body {
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  height: 100vh;
  overflow: hidden;
}

/* ═══════ Shell ═══════ */
.shell { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

/* ═══════ Nav Rail ═══════ */
.nav-rail {
  width: 56px; flex-shrink: 0; background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 4px;
}
.nav-btn {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  border: none; background: transparent; color: var(--text-muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 120ms ease;
}
.nav-btn:hover { background: var(--bg-hover); color: var(--text); }
.nav-btn.is-active { background: var(--accent-soft); color: var(--accent); }
.nav-divider { width: 24px; height: 1px; background: var(--border); margin: 8px 0; }

/* ═══════ File Panel ═══════ */
.file-panel {
  width: 240px; flex-shrink: 0; background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column; overflow: hidden;
}
.vault-bar {
  padding: 6px 10px; border-bottom: 1px solid var(--sidebar-border);
  display: flex; align-items: center; gap: 6px;
}
.vault-select {
  flex: 1; height: 30px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 12.5px; color: var(--text); background: var(--bg-panel);
  outline: none; cursor: pointer;
}
.vault-select:focus { border-color: var(--accent); }
.btn-icon {
  width: 26px; height: 26px; border: none; background: transparent;
  border-radius: 6px; cursor: pointer; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: all 120ms ease;
}
.btn-icon:hover { background: rgba(0,0,0,0.05); color: var(--text); }

.tree-scroll { flex: 1; overflow-y: auto; padding: 6px; }

.tree-group { margin-bottom: 6px; }
.tree-group-label {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px; font-size: 11.5px; font-weight: 600;
  color: var(--text-muted); letter-spacing: 0.03em;
  cursor: pointer; user-select: none; border-radius: 5px;
  transition: background 120ms ease;
}
.tree-group-label:hover { background: rgba(0,0,0,0.03); }
.tree-group-label .chevron {
  width: 12px; height: 12px; display: flex; align-items: center;
  justify-content: center; font-size: 10px;
  transition: transform 120ms ease;
}
.tree-group-label .chevron.collapsed { transform: rotate(-90deg); }
.tree-children { padding-left: 16px; }
.tree-children.collapsed { display: none; }

.tree-item {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 8px; font-size: 12.5px; color: var(--text);
  cursor: pointer; border-radius: 5px;
  transition: background 120ms ease;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  position: relative;
}
.tree-item:hover { background: rgba(0,0,0,0.04); }
.tree-item.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tree-item .tree-icon { font-size: 13px; opacity: 0.5; flex-shrink: 0; }
.tree-item .tree-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tree-item.is-active .tree-icon { opacity: 1; }

/* "+" 快捷按钮 — hover 时显示 */
.tree-item-op {
  display: none; flex-shrink: 0;
  width: 20px; height: 20px; border: none;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 4px; cursor: pointer;
  font-size: 14px; font-weight: 700; line-height: 1;
  align-items: center; justify-content: center;
  transition: all 120ms ease;
}
.tree-item:hover .tree-item-op { display: flex; }
.tree-item-op:hover { background: var(--accent); color: #fff; }

.tree-group-label .tree-item-op {
  display: none; flex-shrink: 0;
  width: 20px; height: 20px; border: none;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 4px; cursor: pointer;
  font-size: 14px; font-weight: 700; line-height: 1;
  align-items: center; justify-content: center;
  margin-left: auto; transition: all 120ms ease;
}
.tree-group-label:hover .tree-item-op { display: flex; }
.tree-group-label .tree-item-op:hover { background: var(--accent); color: #fff; }

/* ═══════ Main ═══════ */
.main {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; min-width: 0;
}
.main-header {
  padding: 16px 24px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.main-header h1 { font-size: 17px; font-weight: 600; color: var(--text-strong); letter-spacing: -0.01em; }
.main-header .breadcrumbs { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.main-content { flex: 1; overflow-y: auto; padding: 24px 32px; }

/* ═══════ Buttons ═══════ */
.btn {
  height: 34px; padding: 0 14px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-panel);
  color: var(--text); font-size: 13px; font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  transition: all 120ms ease; font-family: var(--sans);
}
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
.btn.ghost:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-group { display: flex; gap: 8px; }

.header-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 32px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-panel); color: var(--text-muted);
  font: inherit; font-size: 12.5px; font-weight: 500;
  cursor: pointer; transition: all 120ms ease; white-space: nowrap;
}
.header-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.header-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.header-btn.is-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.header-btn.is-accent:hover { background: var(--accent-hover); }

/* ═══════ Empty state / CTA ═══════ */
.empty-wiki {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%;
  text-align: center; padding: 40px;
}
.empty-wiki .ew-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.empty-wiki .ew-title {
  font-size: 18px; font-weight: 600; color: var(--text-strong);
  margin-bottom: 8px;
}
.empty-wiki .ew-desc {
  font-size: 13px; color: var(--text-muted); max-width: 440px;
  line-height: 1.7; margin-bottom: 24px;
}
.empty-wiki .ew-features {
  text-align: left; font-size: 12.5px; color: var(--text-muted);
  margin-bottom: 24px; max-width: 360px;
}
.empty-wiki .ew-features li { margin: 4px 0; }

/* ═══════ Markdown preview ═══════ */
.md-preview { font-size: 14px; line-height: 1.7; color: var(--text); }
.md-preview h1 { font-size: 24px; font-weight: 700; color: var(--text-strong); margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.md-preview h2 { font-size: 18px; font-weight: 600; color: var(--text-strong); margin: 24px 0 10px; }
.md-preview p { margin: 0 0 12px; }
.md-preview ul { margin: 8px 0; padding-left: 22px; }
.md-preview li { margin: 4px 0; }
.md-preview blockquote { border-left: 3px solid var(--accent); padding: 8px 14px; background: var(--accent-soft); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 12px 0; font-style: italic; color: var(--text-muted); }
.md-preview code { font-family: var(--mono); font-size: 12.5px; background: var(--bg-subtle); padding: 1px 5px; border-radius: 4px; }

/* ═══════ Wiki Result (INDEX.md) ═══════ */
.wiki-result { font-size: 14px; line-height: 1.7; color: var(--text); }
.wiki-result h1 {
  font-size: 24px; font-weight: 700; color: var(--text-strong);
  margin: 0 0 8px; padding-bottom: 8px; border-bottom: 2px solid var(--accent);
}
.wiki-result .wiki-meta {
  font-size: 12.5px; color: var(--text-muted); margin-bottom: 24px;
  font-style: italic;
}
.wiki-result h2 {
  font-size: 17px; font-weight: 600; color: var(--text-strong);
  margin: 24px 0 10px; padding-left: 10px; border-left: 3px solid var(--accent);
}
.wiki-result .wiki-entry {
  display: flex; gap: 8px; padding: 4px 0 4px 12px;
  font-size: 13.5px;
}
.wiki-result .wiki-entry-type {
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  font-weight: 600; flex-shrink: 0; align-self: center;
  font-family: var(--mono);
}
.wiki-result .wiki-entry-type.type-summary { background: var(--blue-bg); color: var(--blue); }
.wiki-result .wiki-entry-type.type-concept { background: var(--purple-bg); color: var(--purple); }
.wiki-result .wiki-entry-type.type-entity { background: var(--green-bg); color: var(--green); }
.wiki-result .wiki-entry-type.type-comparison { background: var(--amber-bg); color: var(--amber); }
.wiki-result .wiki-entry-type.type-overview { background: #fce7f3; color: #be185d; }

/* ═══════ Wiki Page (individual page view) ═══════ */
.wiki-page { font-size: 14px; line-height: 1.7; color: var(--text); }
.wiki-page .wiki-page-header { margin-bottom: 20px; }
.wiki-page .wiki-page-type {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px;
  font-weight: 600; font-family: var(--mono); margin-bottom: 8px;
}
.wiki-page .wiki-page-title {
  font-size: 22px; font-weight: 700; color: var(--text-strong);
  margin: 0;
}
.wiki-page .wiki-page-body { margin-top: 16px; }
.wiki-page .wiki-page-body p { margin: 0 0 12px; }
.wiki-page .wiki-page-body h2 { font-size: 17px; font-weight: 600; color: var(--text-strong); margin: 20px 0 8px; }

/* Wiki links — [[style]] */
.wiki-link {
  color: var(--blue); text-decoration: none;
  font-family: var(--mono); font-size: 12.5px;
  background: var(--blue-bg); padding: 1px 6px; border-radius: 4px;
  cursor: pointer; transition: all 120ms ease;
}
.wiki-link:hover { text-decoration: underline; background: var(--blue-border); }

/* ═══════ LOG.md Preview ═══════ */
.log-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
  margin-top: 12px;
}
.log-table th {
  text-align: left; padding: 6px 10px;
  border-bottom: 2px solid var(--border);
  font-weight: 600; color: var(--text-muted);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
}
.log-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); }
.log-table .status-ok { color: var(--green); font-weight: 600; }
.log-table .tag {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  background: var(--bg-subtle); font-size: 11px; margin-right: 3px;
  font-family: var(--mono);
}

/* ═══════ AI Chat Panel ═══════ */
.ai-chat-panel {
  width: 0; flex-shrink: 0;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: width 300ms ease;
  position: relative;
}
.ai-chat-panel.is-open { width: 420px; min-width: 420px; }

.ai-chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.ai-chat-header h3 {
  font-size: 13px; font-weight: 600; color: var(--text-strong);
  display: flex; align-items: center; gap: 6px;
}
.ai-chat-header h3 .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); display: inline-block;
}
.ai-chat-header h3 .dot.is-busy {
  background: var(--amber);
  animation: pulse 1.5s ease-in-out infinite;
}

/* 操作类型标签 */
.op-tag {
  font-size: 10px; padding: 2px 7px; border-radius: 3px;
  font-weight: 600; font-family: var(--mono); margin-left: 6px;
}
.op-tag.op-build { background: var(--accent-soft); color: var(--accent); }
.op-tag.op-ingest { background: var(--blue-bg); color: var(--blue); }
.op-tag.op-lint { background: var(--amber-bg); color: var(--amber); }
.op-tag.op-query { background: var(--purple-bg); color: var(--purple); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.ai-chat-body {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 16px;
}

/* System prompt (collapsible) */
.prompt-collapsed {
  font-size: 12px; color: var(--text-muted);
  padding: 8px 12px; background: var(--bg-subtle);
  border-radius: var(--radius-sm); border-left: 3px solid var(--blue);
  cursor: pointer; transition: background 120ms ease;
}
.prompt-collapsed:hover { background: var(--bg-hover); }
.prompt-collapsed .prompt-title {
  font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px;
}
.prompt-collapsed .prompt-preview {
  margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.prompt-collapsed .prompt-arrow {
  font-size: 10px; margin-left: auto;
  transition: transform 120ms ease;
}
.prompt-collapsed.is-expanded .prompt-arrow { transform: rotate(180deg); }

.prompt-full {
  display: none;
  font-size: 11.5px; color: var(--text-muted);
  padding: 10px 12px; background: var(--bg);
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  margin-top: 4px;
  font-family: var(--mono); line-height: 1.6;
  white-space: pre-wrap;
}
.prompt-full.show { display: block; }

/* Message types */
.chat-msg { display: flex; flex-direction: column; gap: 4px; animation: fadeIn 200ms ease; }
.chat-msg.user { align-self: flex-end; max-width: 85%; }
.chat-msg.user .msg-bubble {
  padding: 10px 14px; background: var(--accent-soft);
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text);
}
.chat-msg.ai { align-self: flex-start; max-width: 100%; }
.chat-msg.ai .msg-bubble {
  padding: 10px 14px; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; color: var(--text); line-height: 1.6;
}
.chat-msg.ai .msg-bubble code {
  font-family: var(--mono); font-size: 12px;
  background: var(--bg-subtle); padding: 1px 4px; border-radius: 3px;
}
.chat-msg.ai .msg-bubble ul { margin: 6px 0; padding-left: 20px; }
.chat-msg.ai .msg-bubble li { margin: 2px 0; }

/* Thinking block */
.thinking-block {
  padding: 8px 12px; background: var(--bg-subtle);
  border-radius: var(--radius-sm); border-left: 3px solid var(--amber);
  font-size: 12.5px; color: var(--text-muted); font-style: italic;
  display: flex; align-items: center; gap: 6px;
}
.thinking-block .spinner-inline {
  width: 12px; height: 12px; border: 2px solid var(--border);
  border-top-color: var(--amber); border-radius: 50%;
  animation: spin 0.8s linear infinite; flex-shrink: 0;
}

/* File operation badges in AI message */
.file-ops { margin: 8px 0; }
.file-op {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 0; font-size: 12px;
}
.file-op-badge {
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  font-weight: 700; font-family: var(--mono); flex-shrink: 0;
}
.file-op-badge.op-new { background: var(--green-bg); color: var(--green); }
.file-op-badge.op-update { background: var(--blue-bg); color: var(--blue); }
.file-op-badge.op-append { background: var(--amber-bg); color: var(--amber); }
.file-op-path {
  font-family: var(--mono); font-size: 11.5px; color: var(--text-muted);
}

/* Action buttons in AI message */
.msg-actions {
  display: flex; gap: 8px; margin-top: 8px;
  padding-top: 8px; border-top: 1px solid var(--border);
}
.msg-actions .btn { height: 28px; padding: 0 12px; font-size: 12px; }

.msg-time { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

/* Chat input area */
.ai-chat-input {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
  flex-shrink: 0;
}
.chat-composer { display: flex; gap: 8px; align-items: flex-end; }
.chat-composer textarea {
  flex: 1; min-height: 36px; max-height: 120px;
  padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; color: var(--text); background: var(--bg);
  outline: none; font-family: var(--sans); resize: none;
  transition: border-color 120ms ease; line-height: 1.5;
}
.chat-composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chat-composer textarea:disabled { background: var(--bg-hover); color: var(--text-faint); }
.chat-composer .send-btn {
  width: 36px; height: 36px; border-radius: 6px;
  border: none; background: var(--accent); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: background 120ms ease; flex-shrink: 0;
}
.chat-composer .send-btn:hover { background: var(--accent-hover); }
.chat-composer .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Quick actions */
.quick-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.quick-action {
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg);
  font-size: 11.5px; color: var(--text-muted); cursor: pointer;
  transition: all 120ms ease; white-space: nowrap;
}
.quick-action:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ═══════ Animations ═══════ */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ═══════ Toast ═══════ */
.toast-container {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 10px 16px; border-radius: var(--radius-sm);
  font-size: 13px; box-shadow: var(--shadow-md);
  animation: fadeIn 200ms ease;
}
.toast.success { background: var(--green-bg); color: var(--green); }
.toast.info { background: var(--blue-bg); color: var(--blue); }
</style>
</head>
<body>

<div class="shell">
  <!-- ═══ Nav Rail ═══ -->
  <nav class="nav-rail">
    <button class="nav-btn" title="Home">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10l7-7 7 7M5 8.5V16a1 1 0 001 1h3v-4h2v4h3a1 1 0 001-1V8.5"/></svg>
    </button>
    <button class="nav-btn is-active" title="Knowledge Base">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4a1 1 0 011-1h4l1.5 1.5H16a1 1 0 011 1V16a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"/><path d="M3 8h14"/></svg>
    </button>
    <div class="nav-divider"></div>
    <button class="nav-btn" title="Runtimes">

// ════════════════════════════════════════
// File Tree Rendering
// ════════════════════════════════════════
function renderTree() {
  const container = document.getElementById('treeScroll');
  let html = '';

  // 构建后：根目录的 INDEX.md 和 LOG.md
  if (isWikiBuilt) {
    html += `<div class="tree-item" onclick="showView('wikiIndex')">
      <span class="tree-icon">📋</span>
      <span class="tree-name">INDEX.md</span>
    </div>`;
    html += `<div class="tree-item" onclick="showView('log')">
      <span class="tree-icon">📝</span>
      <span class="tree-name">LOG.md</span>
    </div>`;
  }

  // notes/ 目录
  html += `<div class="tree-group">
    <div class="tree-group-label" onclick="toggleGroup(this)">
      <span class="chevron">▾</span>
      <span>📁 notes/</span>
      <button class="tree-item-op" onclick="event.stopPropagation(); addFolderToWiki('notes/')" title="把整个目录加入 Wiki">+</button>
    </div>
    <div class="tree-children">`;
  rawFiles.forEach(f => {
    html += `<div class="tree-item" onclick="selectFile(this, '${f.name}')" data-file="${f.name}">
      <span class="tree-icon">📄</span>
      <span class="tree-name">${f.name}</span>
      <button class="tree-item-op" onclick="event.stopPropagation(); addFileToWiki('${f.path}')" title="加入 Wiki">+</button>
    </div>`;
  });
  html += `</div></div>`;

  // wiki/ 目录 (构建后)
  if (isWikiBuilt) {
    html += renderWikiTreeGroup(wikiTree, 0);
  }

  container.innerHTML = html;
}

function renderWikiTreeGroup(node, depth) {
  let html = `<div class="tree-group">
    <div class="tree-group-label" onclick="toggleGroup(this)" style="padding-left:${8 + depth * 16}px">
      <span class="chevron">▾</span>
      <span>📁 ${node.name}/</span>
    </div>
    <div class="tree-children">`;

  node.children.forEach(child => {
    if (child.children) {
      html += renderWikiTreeGroup(child, depth + 1);
    } else {
      html += `<div class="tree-item" onclick="showWikiPage('${child.slug}')" style="padding-left:${8 + (depth + 1) * 16}px">
        <span class="tree-icon">📄</span>
        <span class="tree-name">${child.name}</span>
      </div>`;
    }
  });

  html += `</div></div>`;
  return html;
}

function toggleGroup(el) {
  const children = el.nextElementSibling;
  const chevron = el.querySelector('.chevron');
  if (children && children.classList.contains('tree-children')) {
    children.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed');
  }
}

// ════════════════════════════════════════
// View Switching
// ════════════════════════════════════════
function showView(view) {
  const views = ['viewEmpty', 'viewFile', 'viewWikiIndex', 'viewWikiPage', 'viewLog'];
  views.forEach(v => {
    document.getElementById(v).style.display = 'none';
  });

  // 清除 tree-item active 状态
  document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('is-active'));

  switch (view) {
    case 'empty':
      document.getElementById('viewEmpty').style.display = 'flex';
      document.getElementById('pageTitle').textContent = 'frontend-notes';
      document.getElementById('breadcrumbs').textContent = '知识库 · 10 个文件';
      break;
    case 'wikiIndex':
      document.getElementById('viewWikiIndex').style.display = 'block';
      document.getElementById('pageTitle').textContent = 'INDEX.md';
      document.getElementById('breadcrumbs').textContent = 'frontend-notes / INDEX.md';
      renderIndexMd();
      // 标记 tree item
      document.querySelectorAll('.tree-item').forEach(i => {
        if (i.querySelector('.tree-name')?.textContent === 'INDEX.md') i.classList.add('is-active');
      });
      break;
    case 'log':
      document.getElementById('viewLog').style.display = 'block';
      document.getElementById('pageTitle').textContent = 'LOG.md';
      document.getElementById('breadcrumbs').textContent = 'frontend-notes / LOG.md';
      renderLogMd();
      document.querySelectorAll('.tree-item').forEach(i => {
        if (i.querySelector('.tree-name')?.textContent === 'LOG.md') i.classList.add('is-active');
      });
      break;
  }
}

// ════════════════════════════════════════
// Wiki Page Viewing
// ════════════════════════════════════════
function showWikiPage(slug) {
  const page = wikiPages[slug];
  if (!page) return;

  const views = ['viewEmpty', 'viewFile', 'viewWikiIndex', 'viewWikiPage', 'viewLog'];
  views.forEach(v => document.getElementById(v).style.display = 'none');
  document.getElementById('viewWikiPage').style.display = 'block';

  document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('is-active'));
  // 找到对应的 tree item 并标记
  document.querySelectorAll('.tree-item').forEach(i => {
    const name = i.querySelector('.tree-name')?.textContent;
    if (name && wikiTree && findSlugInTree(wikiTree, slug, name)) {
      i.classList.add('is-active');
    }
  });

  document.getElementById('pageTitle').textContent = page.title;
  document.getElementById('breadcrumbs').textContent = `wiki / ${page.title}`;

  const typeLabels = { summary: '摘要', concept: '概念', entity: '实体', comparison: '对比', overview: '总览' };
  const typeColors = { summary: 'background:var(--blue-bg);color:var(--blue)', concept: 'background:var(--purple-bg);color:var(--purple)', entity: 'background:var(--green-bg);color:var(--green)', comparison: 'background:var(--amber-bg);color:var(--amber)', overview: 'background:#fce7f3;color:#be185d' };

  let linksHtml = '';
  if (page.links && page.links.length > 0) {
    linksHtml = '<h2>相关链接</h2><p>' +
      page.links.map(l => {
        const linked = wikiPages[l];
        return linked ? `<a class="wiki-link" onclick="showWikiPage('${l}')">[[${linked.title}]]</a>` : '';
      }).filter(Boolean).join(' ') +
      '</p>';
  }

  document.getElementById('wikiPageContent').innerHTML = `
    <div class="wiki-page-header">
      <span class="wiki-page-type" style="${typeColors[page.type]}">${typeLabels[page.type]}</span>
      <h1 class="wiki-page-title">${page.title}</h1>
    </div>
    <blockquote style="border-left:3px solid var(--accent);padding:8px 14px;background:var(--accent-soft);border-radius:0 8px 8px 0;margin:12px 0;font-style:italic;color:var(--text-muted);">${page.summary}</blockquote>
    <div class="wiki-page-body">${page.content}</div>
    ${linksHtml}
  `;
}

function findSlugInTree(node, slug, name) {
  if (node.slug === slug) {
    // 检查文件名是否匹配
    const page = wikiPages[slug];
    if (!page) return false;
    // 简单匹配
    return true;
  }
  if (node.children) {
    return node.children.some(c => findSlugInTree(c, slug, name));
  }
  return false;
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  // 自动判断操作类型
  let op = currentOp;
  if (text.includes('构建') || text.includes('初始化')) op = 'build';
  else if (text.includes('加入') || text.includes('ingest') || text.includes('整合')) op = 'ingest';
  else if (text.includes('检查') || text.includes('健康') || text.includes('lint')) op = 'lint';
  else op = 'query';

  currentOp = op;
  updateOpTag();
  renderPrompt();
  sendChatMessage(text, op);
}

function sendChatMessage(text, op) {
  if (isAiBusy) return;
  addUserMessage(text);
  setAiBusy(true);

  setTimeout(() => {
    handleClaudeResponse(text, op);
    setAiBusy(false);
  }, 800 + Math.random() * 800);
}

  }

  // ══ Build: 用这个方案 ══
  if (op === 'build' && (msg.includes('用这个') || msg.includes('好'))) {
    sendChatMessage('执行构建', 'build');
    return;
  }

  // ══ Ingest: 单文件/文件夹 ══
  if (op === 'ingest') {
    const fileName = userMsg.match(/([\w-]+\.md)/)?.[1] || userMsg.match(/([\w-]+\/)/)?.[1] || '文件';
    addThinkingMessage(`正在读取 ${fileName} 并分析现有 wiki...`);
    setTimeout(() => {
      removeThinkingMessage();

      const ops = [
        { type: 'new', path: 'wiki/summaries/' + fileName },
        { type: 'update', path: 'wiki/concepts/react-fundamentals.md' },
        { type: 'update', path: 'wiki/overview.md' },
        { type: 'update', path: 'INDEX.md' },
        { type: 'append', path: 'LOG.md' },
      ];

      addAiMessage(
        `已将 <code>${fileName}</code> 整合到 Wiki 中：<br><br>` +
        renderFileOps(ops) +
        '<br>新页面已创建，相关页面已更新链接。'
      );
    }, 1800);
    return;
  }

  // ══ Lint: 健康检查 ══
  if (op === 'lint') {
    addThinkingMessage('正在扫描 wiki 目录中的所有页面...');
    setTimeout(() => {
      removeThinkingMessage();
      addAiMessage(
        'Wiki 健康检查报告：<br><br>' +
        '<strong>✅ 良好</strong><ul>' +
        '<li>所有页面都有至少一个入站链接</li>' +
        '<li>INDEX.md 与实际页面一致</li>' +
        '<li>无矛盾信息</li>' +
        '</ul>' +
        '<strong>⚠️ 建议改进</strong><ul>' +
        '<li><code>wiki/summaries/nextjs-ssr.md</code> 缺少对 [[React Server Components]] 的引用，建议补充</li>' +
        '<li>缺少 <code>wiki/entities/next-js.md</code> — Next.js 作为重要框架值得单独的实体页</li>' +
        '<li><code>wiki/concepts/css-methodologies.md</code> 内容较薄，建议添加 CSS-in-JS 对比</li>' +
        '</ul>'
      );
    }, 2000);
    return;
  }

  // ══ Query: 问答 ══
  if (op === 'query' || !['build', 'ingest', 'lint'].includes(op)) {
    addThinkingMessage('正在检索相关 wiki 页面...');
    setTimeout(() => {
      removeThinkingMessage();
      addAiMessage(
        '根据 Wiki 中的相关页面，综合回答如下：<br><br>' +
        'React 性能优化的关键策略主要包括：<br><br>' +
        '<strong>1. 渲染优化</strong><br>' +
        '使用 <code>React.memo</code> 避免不必要的重渲染，配合 <code>useMemo</code> 和 <code>useCallback</code> 缓存计算结果和回调函数。' +
        '<em>(来源: [[React 性能优化]])</em><br><br>' +
        '<strong>2. 代码分割</strong><br>' +
        '使用 <code>React.lazy</code> + <code>Suspense</code> 实现路由级别的代码分割，减少首屏加载体积。' +
        '<em>(来源: [[React 性能优化]])</em><br><br>' +
        '<strong>3. 状态管理优化</strong><br>' +
        '使用选择器 memoization (reselect) 避免 Redux 触发的不必要渲染。' +
        '<em>(来源: [[Redux 设计模式]])</em><br><br>' +
        '<strong>4. SSR/SSG</strong><br>' +
        '对首屏要求高的页面使用 Next.js 的 SSG/SSR，减少客户端渲染压力。' +
        '<em>(来源: [[Next.js SSR 深入]])</em>'
      );
    }, 1500);
    return;
  }

  // ══ Default ══
  addAiMessage(
    '收到。你可以继续通过对话操作 Wiki：<ul>' +
    '<li>「开始构建 Wiki」— 初始化构建</li>' +
    '<li>「把 xxx.md 加入 Wiki」— 增量添加</li>' +
    '<li>「检查 Wiki 健康状况」— 质量检查</li>' +
    '<li>直接提问 — 基于 Wiki 回答</li>' +
    '</ul>'
  );
}

// ════════════════════════════════════════
// Build Complete
// ════════════════════════════════════════
function onBuildComplete() {
  isWikiBuilt = true;
  document.getElementById('breadcrumbs').textContent = '知识库 · 10 个文件 · Wiki 已构建';
  document.getElementById('buildBtnText').textContent = 'Wiki 已就绪';
  renderTree();
}

// ════════════════════════════════════════
// Utils
// ════════════════════════════════════════
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(type, message) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 200ms'; }, 2500);
  setTimeout(() => toast.remove(), 2800);
}

// Auto-resize textarea
document.addEventListener('input', (e) => {
  if (e.target.tagName === 'TEXTAREA' && e.target.id === 'chatInput') {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }
});

// Init
renderTree();
showView('empty');
</script>
