server {
    listen 80;
    server_name molio.cn www.molio.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name molio.cn www.molio.cn;

    ssl_certificate /home/certs/molio.cn.pem;
    ssl_certificate_key /home/certs/molio.cn.key;

    root /home/www/molio-landing-page;
    index index.html;

    # ── SSR 商品页（2026-09-01）：以下三条需在 ~* \.html$ 之前，否则正则先匹配 ──

    # 旧详情页 → 301 到新格式（$arg_id 缺失则导向资源库）
    location = /resource.html {
        if ($arg_id) {
            return 301 /resource/$arg_id.html;
        }
        return 301 /resources.html;
    }

    # 资源列表页：跨域 HTTPS 反代到 auth.molio.cn（SSR 输出全部商品，爬虫零 JS 可读）
    location = /resources.html {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 商品详情页：跨域 HTTPS 反代到 auth.molio.cn（FC serverless，非同机）
    location ~ ^/resource/[0-9A-Za-z]+\.html$ {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 动态商品 sitemap
    location = /sitemap-products.xml {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # llms.txt（给 AI 爬虫/大模型读，动态生成商品清单）
    location = /llms.txt {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 文件：不缓存，每次获取最新版本
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 静态资源（CSS/JS/图片/字体）：允许缓存 30 天
    location ~* \.(png|jpg|jpeg|gif|svg|css|js|woff|woff2|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
