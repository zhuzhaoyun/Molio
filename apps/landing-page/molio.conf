# ── 主机名归一（2026-09-17）：www.molio.cn → 301 → molio.cn ──────────
# 带不带 www 在搜索引擎眼里是两个站，同一页面各留一条索引记录，外链权重
# 被劈成两份（GSC 的「备用网页」里已出现 www.molio.cn/、www.molio.cn/index.html）。
#
# 目标主机名写死 molio.cn，不要用 $host：$host 会把 www 原样带进 HTTPS，
# 变成 www → https://www → 还是 www，绕一圈回到原点。
#
# 前提：TLS 证书 SAN 必须覆盖 www.molio.cn（当前 /home/certs/molio.cn.pem
# 的 SAN = molio.cn, www.molio.cn，已覆盖）。证书不含 www 时，https://www
# 会在 TLS 握手阶段就失败，301 根本发不出去——改配置前先确认这一点。

server {
    listen 80;
    server_name molio.cn www.molio.cn;
    return 301 https://molio.cn$request_uri;
}

# www 的 HTTPS 入口：只做跳转，不提供任何内容
server {
    listen 443 ssl;
    server_name www.molio.cn;

    ssl_certificate /home/certs/molio.cn.pem;
    ssl_certificate_key /home/certs/molio.cn.key;

    return 301 https://molio.cn$request_uri;
}

# 主站
server {
    listen 443 ssl;
    server_name molio.cn;

    ssl_certificate /home/certs/molio.cn.pem;
    ssl_certificate_key /home/certs/molio.cn.key;

    root /home/www/molio-landing-page;
    index index.html;

    # 404 统一落到站内 404 页面（页面里给出首页/资源库/博客等入口）。
    # 状态码保持 404，不做 301 到首页：不存在的地址就该是 404，返回
    # 200+首页会被 Google 判成软 404，白白消耗抓取配额；全站跳首页
    # 还会掩盖站内坏链，自己再也发现不了。
    # 注意：只对本地找不到文件的 404 生效。商品页是 proxy_pass 到云端，
    # nginx 默认不拦截上游错误，所以已下架商品仍用云端自己的 404 页。
    error_page 404 /404.html;

    # 404 页面只允许内部跳转访问，直接请求 /404.html 不该拿到 200
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # 历史死链定点 301：旧 FAQ 页 → 使用指南。
    # 只对确有替代页的旧地址做这种映射，不要撒网式跳首页。
    location = /faq.html {
        return 301 /help.html;
    }

    # ── SSR 商品页（2026-09-01）：以下三条需在 ~* \.html$ 之前，否则正则先匹配 ──

    # 旧详情页 → 301 到新格式（$arg_id 缺失则导向资源库）
    location = /resource.html {
        if ($arg_id) {
            return 301 /resource/$arg_id.html;
        }
        return 301 /resources.html;
    }

    # 资源列表页：跨域 HTTPS 反代到 auth.molio.cn（SSR 输出全部商品，爬虫零 JS 可读）
    # 注意：本目录不再保留静态 resources.html —— 那份 CSR 空壳已删除。
    # 要改列表页请改 apps/cloud/src/ssr/render.ts 的 renderListingPage，改这里没用。
    location = /resources.html {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 商品详情页：跨域 HTTPS 反代到 auth.molio.cn（FC serverless，非同机）
    location ~ ^/resource/[0-9A-Za-z]+\.html$ {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 动态商品 sitemap
    location = /sitemap-products.xml {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # llms.txt（给 AI 爬虫/大模型读，动态生成商品清单）
    location = /llms.txt {
        proxy_pass https://auth.molio.cn;
        proxy_ssl_server_name on;
        proxy_set_header Host auth.molio.cn;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 未知路径必须落到 404。原来的兜底是 /index.html，会让
    # /foo/bar/baz 这种地址返回 200 + 首页内容（软 404）。
    # 注意 .html 结尾的请求不经过这里——它们被下面的 ~* \.html$ 正则接走。
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML 文件：不缓存，每次获取最新版本
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 静态资源（CSS/JS/图片/字体）：允许缓存 30 天
    location ~* \.(png|jpg|jpeg|gif|svg|css|js|woff|woff2|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
