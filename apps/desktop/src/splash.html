<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KGE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .splash {
      text-align: center;
    }
    .splash h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .splash p {
      font-size: 14px;
      opacity: 0.6;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #4fc3f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <h1>Knowledge Growth Engine</h1>
    <p>Starting daemon&hellip;</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
