<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Molio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #181816;
      color: #eceae6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .splash {
      text-align: center;
    }
    .splash-logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.14em;
      margin-bottom: 10px;
    }
    .splash-tagline {
      font-size: 13px;
      opacity: 0.4;
      font-family: 'Iowan Old Style', Georgia, 'Source Serif Pro', serif;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: #c96442;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash-logo">Molio</div>
    <div class="splash-tagline">墨藏于库，流于万象</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
