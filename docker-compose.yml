# ============================================================
# Molio — NAS / 服务器一键部署
#
# 支持平台：linux/amd64 + linux/arm64
#   群晖 (Synology)、威联通 (QNAP)、铁威马 (TerraMaster)、
#   TrueNAS、Unraid 等主流 NAS 均可使用。
#
# 使用方式：
#   1. cp .env.example .env  并填写认证信息
#   2. docker compose up -d
#   3. 浏览器打开 http://<NAS-IP>:3100
#
# 本地开发构建（可选）：
#   将下方 image 行注释掉，取消 build 行的注释，然后：
#   docker compose up -d --build
#
# 知识库目录：
#   在 .env 中设置 MOLIO_VAULT_PATH 指向 NAS 上的文档目录，
#   该目录挂载到容器内 /vaults。
#   在 Molio Web UI 创建 vault 时，路径填 /vaults/你的文件夹名。
#
#   如需挂载多个目录，直接在 volumes 中添加更多映射：
#     - /volume1/documents:/vaults/documents
#     - /volume2/notes:/vaults/notes
# ============================================================

services:
  molio:
    image: registry.cn-guangzhou.aliyuncs.com/zzykj/molio:latest
    # build: .  # 本地开发构建时取消注释
    container_name: molio
    ports:
      - "${MOLIO_PORT:-3100}:3100"
    volumes:
      # 应用数据持久化（SQLite 数据库 + 配置文件）
      - molio-data:/home/molio/.molio
      # Claude Code 认证和配置持久化
      - molio-claude:/home/molio/.claude
      # 知识库文档目录（NAS 上的实际文件）
      - ${MOLIO_VAULT_PATH:-./vaults}:/vaults
    # .env 中所有变量透传给容器（ANTHROPIC_*、CLAUDE_CODE_* 等）
    env_file: .env
    environment:
      # 服务端口（容器内部端口，一般不需要改）
      - MOLIO_PORT=3100
    restart: unless-stopped

volumes:
  molio-data:
  molio-claude:
